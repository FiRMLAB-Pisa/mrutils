[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mrutils"
description = "Thin MRI pre- and post-processing utilities: centred FFTs, coil compression, noise prewhitening, partial Fourier, windowing, bias-field correction."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mri", "coil-compression", "prewhitening", "partial-fourier"]
authors = [{ name = "Matteo Cencini", email = "matteo.cencini@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Torch is deliberately not here. Every function takes NumPy arrays as
# readily as tensors, and a scanner host that only ever sees NumPy should not
# have to install a deep-learning runtime to centre an FFT.
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# Torch tensors keep their device throughout; this extra is only the runtime.
torch = ["torch>=2.4"]
# Pipe-Menon density compensation is MRI-NUFFT's estimator.
dcf = ["mri-nufft[finufft]>=1.0"]
# N4 bias-field correction is SimpleITK's.
bias = ["SimpleITK>=2.3"]
all = ["mrutils[torch,dcf,bias]"]
dev = [
  # Every extra, so the docstring examples all run in CI.
  "mrutils[torch,dcf,bias]",
  "pytest>=8",
  "pytest-cov>=5",
  "coverage>=7",
  "ruff>=0.16",
  "pre-commit>=4",
  "build",
]

[project.urls]
Homepage = "https://github.com/FiRMLab-Pisa/mrutils"
Issues = "https://github.com/FiRMLab-Pisa/mrutils/issues"
Source = "https://github.com/FiRMLab-Pisa/mrutils"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/mrutils/_version.py"
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
# src is on the list so every docstring example runs: they are the
# documentation, and an example that has drifted is a broken one.
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --doctest-modules"
markers = [
  "cuda: needs a CUDA device; skipped when none is present",
  "slow: excluded from the default run",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
line-length = 88
# Deliberately NOT `fix = true`: with it, `ruff check` rewrites the working
# tree, so a command that reads as read-only is not. `format_and_lint.sh`
# passes --fix explicitly when it means it.
fix = false
extend-exclude = ["docs/**", "examples/**"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "D", "E", "F", "I", "NPY", "PIE", "PTH", "Q", "RUF", "S", "SIM", "UP", "W", "YTT"]
ignore = [
  "E501",   # line length is the formatter's business
  "COM812", # trailing comma conflicts with the formatter
  "D105",   # magic methods carry their meaning in their name
  "D107",   # __init__ is documented on the class
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ARG"]
"benchmarks/**" = ["D", "S101", "T201"]
"__init__.py" = ["D104", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
